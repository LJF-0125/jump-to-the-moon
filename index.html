<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0b1030">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Jump to the Moon</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0b1030;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    touch-action: none;
    user-select: none;
    overflow: hidden;
  }
  canvas {
    border-radius: 12px;
    box-shadow: 0 8px 40px rgba(0,0,0,.5);
    max-width: 94vw;
    max-height: 82vh;
  }
  #hint { color: #565f89; font-size: 12px; margin-top: 10px; }
  #mutebtn { position: fixed; top: 12px; right: 14px; z-index: 9; cursor: pointer;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15);
    border-radius: 8px; font-size: 17px; padding: 5px 9px; }
  #skipTut { position: fixed; top: 12px; left: 14px; z-index: 9; cursor: pointer;
    background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15);
    border-radius: 8px; font-size: 14px; padding: 6px 10px; color: #c6cfe8; }
  #wrap { position: relative; }
  .panel[hidden] { display: none; }  /* display:flex 会盖掉 hidden 属性，必须显式补回 */
  .panel { position: absolute; inset: 0; z-index: 5; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 14px; border-radius: 12px;
    background: rgba(11,16,48,.78); backdrop-filter: blur(8px); color: #e8ecf8;
    text-align: center; padding: 20px; }
  .panel h2 { font-size: 22px; font-weight: 600; }
  .bank { color: #9aa7d0; font-size: 14px; }
  .bank b { color: #ffd54a; }
  .bigbtn { width: 200px; padding: 13px 0; font-size: 17px; font-weight: 600; color: #fff;
    background: linear-gradient(160deg, #5b8ff5, #2f6bf0); border: none; border-radius: 12px; cursor: pointer;
    box-shadow: 0 6px 18px rgba(47,107,240,.4); }
  .bigbtn:hover { filter: brightness(1.08); }
  .bigbtn.sub { background: rgba(255,255,255,.12); font-weight: 500; box-shadow: none; }
  .bigbtn:active { transform: scale(.96); }
  /* ---- 首页：星空 + 立体月亮 + 悬浮小球 ---- */
  #home { background: linear-gradient(180deg, rgba(13,18,48,.96), rgba(8,11,32,.98)); }
  #home .star { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff;
    animation: twinkle 2.4s ease-in-out infinite; }
  .home-cloud { position: absolute; width: 220px; height: 70px; border-radius: 50%;
    background: radial-gradient(ellipse, rgba(200,215,245,.14), transparent 70%); filter: blur(6px); }
  @keyframes twinkle { 0%, 100% { opacity: .12; } 50% { opacity: .9; } }
  .scene { position: relative; width: 220px; height: 190px; flex: none; }
  /* 终点同款月亮：奶黄平面圆 + 暖光晕 + 4 个平底陨石坑（按游戏内 r=70 等比放大） */
  .moon3d { position: absolute; left: 55px; top: 66px; width: 110px; height: 110px; border-radius: 50%; z-index: 2;
    background: #f7f3d8; box-shadow: 0 0 60px rgba(255,246,200,.55); overflow: hidden; }
  .moon3d .crater { position: absolute; border-radius: 50%; background: rgba(190,185,150,.5); }
  .moon3d .crater:nth-child(1) { left: 28px; top: 35px; width: 19px; height: 19px; }
  .moon3d .crater:nth-child(2) { left: 62px; top: 54px; width: 14px; height: 14px; }
  .moon3d .crater:nth-child(3) { left: 45px; top: 70px; width: 11px; height: 11px; }
  .moon3d .crater:nth-child(4) { left: 74px; top: 30px; width: 9px; height: 9px; }
  .hero { position: absolute; left: 82px; top: 30px; width: 56px; height: 56px; border-radius: 50%; z-index: 1;
    background: radial-gradient(circle at 35% 30%, #9ec2ff, #5b8ff5 60%, #2f6bf0);
    box-shadow: 0 0 22px rgba(91,143,245,.85), 0 0 60px rgba(91,143,245,.4);
    animation: floaty 3.4s ease-in-out infinite; }
  .hero::after { content: ''; position: absolute; inset: -14px; border-radius: 50%; z-index: -1;
    background: radial-gradient(circle, rgba(91,143,245,.35), transparent 70%);
    animation: glowPulse 3.4s ease-in-out infinite; }
  @keyframes floaty { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-7px); } }
  @keyframes glowPulse { 0%, 100% { opacity: .7; } 50% { opacity: 1; } }
  .hero .eye { position: absolute; top: 20px; width: 9px; height: 14px; border-radius: 5px; background: #fff; }
  .hero .eye:first-child { left: 16px; }
  .hero .eye:last-child { left: 31px; }
  .title-block { position: relative; line-height: 1.05; }
  .t-big { font-size: 34px; font-weight: 800; letter-spacing: 1px; }
  .t-mid { font-size: 13px; color: #aab6e0; letter-spacing: 4px; margin: 3px 0; }
  .t-star { position: absolute; color: #ffd54a; font-size: 12px; animation: twinkle 1.8s ease-in-out infinite; }
  .t-star.s1 { left: -24px; top: 10px; }
  .t-star.s2 { right: -20px; bottom: 16px; animation-delay: .9s; }
  #shopList, #achList { width: 100%; max-width: 320px; max-height: 46vh; overflow-y: auto;
    display: flex; flex-direction: column; gap: 8px; }
  .shop-cat { color: #9aa7d0; font-size: 12px; letter-spacing: 2px; margin-top: 6px; text-align: left; }
  .shop-row { display: flex; align-items: center; gap: 10px;
    background: rgba(255,255,255,.06); border-radius: 10px; padding: 9px 12px; }
  .shop-name { flex: 1; text-align: left; font-size: 14px; }
  .shop-name small { display: block; color: #8b96bd; font-size: 11px; margin-top: 2px; }
  .mini-ball { width: 22px; height: 22px; border-radius: 50%; flex: none; }
  .shop-btn { flex: none; min-width: 76px; padding: 7px 10px; font-size: 13px; border: none;
    border-radius: 8px; background: linear-gradient(160deg, #5b8ff5, #2f6bf0); color: #fff; cursor: pointer; }
  .shop-btn:disabled { background: rgba(255,255,255,.12); color: #8b96bd; cursor: default; }
  #shareImg { max-width: 78%; max-height: 48vh; border-radius: 10px; box-shadow: 0 6px 24px rgba(0,0,0,.5); }
  a.bigbtn { display: inline-block; text-decoration: none; }
</style>
</head>
<body>
  <button id="mutebtn" title="静音 (M)">🔊</button>
  <button id="skipTut" hidden>跳过 ›</button>
  <div id="wrap">
    <canvas id="game" width="420" height="640"></canvas>
    <div id="home" class="panel">
      <span class="star" style="left:8%;top:14%"></span>
      <span class="star" style="left:16%;top:72%;animation-delay:.6s"></span>
      <span class="star" style="left:84%;top:10%;animation-delay:1.2s"></span>
      <span class="star" style="left:90%;top:64%;animation-delay:.3s"></span>
      <span class="star" style="left:70%;top:86%;animation-delay:1.5s"></span>
      <span class="star" style="left:26%;top:22%;animation-delay:.9s"></span>
      <span class="star" style="left:78%;top:34%;animation-delay:1.8s"></span>
      <span class="star" style="left:12%;top:44%;animation-delay:2.1s"></span>
      <span class="star" style="left:62%;top:6%;animation-delay:.4s"></span>
      <span class="star" style="left:36%;top:90%;animation-delay:1.1s"></span>
      <span class="home-cloud" style="left:-46px;bottom:-26px"></span>
      <span class="home-cloud" style="right:-52px;bottom:-16px"></span>
      <div class="scene">
        <div class="moon3d"><span class="crater"></span><span class="crater"></span><span class="crater"></span><span class="crater"></span></div>
        <div class="hero"><span class="eye"></span><span class="eye"></span></div>
      </div>
      <div class="title-block">
        <span class="t-star s1">✦</span><span class="t-star s2">✦</span>
        <div class="t-big">Jump</div>
        <div class="t-mid">to the</div>
        <div class="t-big">Moon</div>
      </div>
      <p class="bank">金币 <b id="homeBank">0</b> · 最高 <b id="homeBest">0</b> m</p>
      <button id="btnStart" class="bigbtn">▶ 开始游戏</button>
      <button id="btnShop" class="bigbtn sub">🛍 商店</button>
      <button id="btnAch" class="bigbtn sub">🏆 成就</button>
      <button id="btnTut" class="bigbtn sub">📖 玩法教学</button>
    </div>
    <div id="shop" class="panel" hidden>
      <h2>商店</h2>
      <p class="bank">金币 <b id="shopBank">0</b></p>
      <div id="shopList"></div>
      <button id="btnBack" class="bigbtn sub">返回</button>
    </div>
    <div id="death" class="panel" hidden>
      <h2 id="deathTitle">坠落啦</h2>
      <p class="bank" id="deathStats"></p>
      <button id="btnRetry" class="bigbtn">再来一局</button>
      <button id="btnShare" class="bigbtn sub">📸 生成战绩图</button>
      <button id="btnDeathShop" class="bigbtn sub">商店</button>
      <button id="btnHome" class="bigbtn sub">回首页</button>
    </div>
    <div id="ach" class="panel" hidden>
      <h2>成就</h2>
      <div id="achList"></div>
      <button id="btnAchBack" class="bigbtn sub">返回</button>
    </div>
    <div id="share" class="panel" hidden>
      <h2>战绩图</h2>
      <img id="shareImg" alt="战绩图">
      <p class="bank">手机长按图片保存，电脑点下方下载</p>
      <a id="btnDl" class="bigbtn" download="jump-to-the-moon.png">下载图片</a>
      <button id="btnShareBack" class="bigbtn sub">返回</button>
    </div>
  </div>
  <div id="hint">←/→ 或 A/D 移动 · 手机按住屏幕左右半边 · M 静音</div>

<script>
const W = 420, H = 640;
const PX_PER_M = 8;          // 8 像素 = 1 米
const MOON_M = 1500;         // 月球高度
const GROUND_Y = H - 60;
const ZHUI_FALL_G = 0.20;   // 坠明「缓刑」：下坠段重力（正常 0.35），上升段不动
const HAZ_WARN = 260;   // 乌云预警距离（px，约 33 米；触发后三角常亮到进场）
// 风带：按距离固定分布，300m 起每 300m 一片、100m 厚（1500m 前共 4 片），方向每局随机
const WIND_START_M = 300, WIND_EVERY_M = 300, WIND_THICK_M = 100;
const WIND_V = [1.6, 2.4, 2.7];   // 微风/大风/狂风（px/帧，按第几片风带递增，第 3 片起封顶）
const WIND_WARN_M = 45;   // 风带预警距离（米）：进带前这么远就弹横幅+箭头+风声渐起

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// 高分屏适配：按 devicePixelRatio 放大画布实际像素，逻辑坐标仍是 420×640
// 不放大的话手机上 CSS 拉伸 420×640 的位图会糊
const DPR = Math.min(window.devicePixelRatio || 1, 3);
canvas.width = W * DPR;
canvas.height = H * DPR;
ctx.scale(DPR, DPR);

// 老浏览器没有 roundRect，补一个
if (!ctx.roundRect) {
  CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) {
    this.moveTo(x + r, y);
    this.arcTo(x + w, y, x + w, y + h, r);
    this.arcTo(x + w, y + h, x, y + h, r);
    this.arcTo(x, y + h, x, y, r);
    this.arcTo(x, y, x + w, y, r);
    this.closePath();
    return this;
  };
}

let ball, platforms, camY, nextPlatY, bestMeters, dead, won, wonT, squashT, meters, maxAlt;
let milestoneT = 0, nextMilestone = 500, milestoneText = '';
let k3Fx = [], k3T = 0, k3Done = false;   // 716m K3 发布纪念彩蛋
let invincibleT = 0;   // 无敌帧数（弹簧云弹射 / 被乌云劈掉心后），期间乌云不判定
let hp = 2, maxHp = 2;   // 血量：乌云劈掉 1 颗心，心没了才死；坠落仍即死（护盾才救）
let coins = [], coinCount = 0, frame = 0;
let powerups = [], temp = {magnet: 0, spring: 0, shield: 0};  // 路上捡的限时道具，temp 存剩余帧数（heart 是瞬发回血，不进 temp）
let hazards = [];   // 乌云：碰到掉一颗心
let keys = {left: false, right: false};
let touchDir = 0; // -1 左 0 无 1 右
let achT = 0, achQueue = [], achText = '';   // 成就解锁横幅（队列逐个播）
let zapped = false, shieldSaved = false;     // 本局标记：被乌云劈过 / 护盾救过命（成就用）
let windDirs = [];         // 每片风带的方向（±1，本局内随机生成后固定）
let windDrift = 0;         // 当前风漂移速度（px/帧，平滑趋近风力）
let windBandT = 0, windBandText = '', lastBand = -1;   // 风带进场横幅
let lastApproach = -1;   // 风带预警去重（每片只预警一次）
let tutStep = 0, tutCount = 0;                    // 教学：0 学移动 / 1 学跳云 / 2 图鉴
let startX = 0, tutMinX = 0, tutMaxX = 0;         // 教学第 1 步的左右移动检测
let taxUsed = false;         // 断魄「死与税」：每局限一次
let shieldCharges = 0;       // 通碧「等价交换」换来的无时限护盾次数
let combo = 0;               // 折镜「利滚利」踩云计数
let skillT = 0, skillText = '';   // 技能触发横幅

// ---------- 存档 / 商店 ----------
let screen = 'home';     // home | shop | game
let bounceV = -11.2;     // 弹簧鞋会调高
let shieldUsed = false;

// 存档读取统一走 loadJSON：数据损坏时兜底回默认值，别让游戏白屏打不开
function loadJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    if (raw === null) return fallback;
    return JSON.parse(raw);
  } catch (e) { return fallback; }
}

let bank = +(localStorage.getItem('jtm_bank')) || 0;   // 脏数据 → NaN → 0
let ownedSkins = loadJSON('jtm_skins', ['yingyan']);
if (!Array.isArray(ownedSkins)) ownedSkins = ['yingyan'];
let curSkin = localStorage.getItem('jtm_skin') || 'yingyan';
let ownedItems = loadJSON('jtm_items', {});
let equip = loadJSON('jtm_equip', {});
let ach = loadJSON('jtm_ach', {});

const SKINS = [
  {id: 'yingyan', name: '荧焰', price: 0,   c: ['#9ec2ff', '#5b8ff5', '#2f6bf0'], skill: '平凡及喜乐', sd: '没有技能，但平安快乐'},
  {id: 'zhejing', name: '折镜', price: 30,  c: ['#ffffff', '#e2e8f5', '#aeb9d4'], eye: '#3a4460', skill: '利滚利', sd: '每踩满 10 朵云，+1 金币'},
  {id: 'duanpo',  name: '断魄', price: 50,  c: ['#ffc9c9', '#f58f8f', '#e05757'], skill: '死与税', sd: '死亡时清空本局金币换复活（每局一次，护盾优先；0 金币不复活）'},
  {id: 'zhui',    name: '坠明', price: 80,  c: ['#e0ccff', '#b08ff5', '#835bf0'], skill: '缓刑', sd: '下坠变慢更飘，多点时间调整落点'},
  {id: 'tongbi',  name: '通碧', price: 150, c: ['#d8f7b0', '#93e07d', '#4fbd55'], skill: '等价交换', sd: '开局压到 1 心，每颗心换 1 次无时限护盾（红心可捡回）'},
];

// 旧版皮肤 id 迁移到角色 id
const OLD_SKIN_MAP = {blue: 'yingyan', pink: 'duanpo', green: 'tongbi', purple: 'zhui'};
ownedSkins = [...new Set(ownedSkins.map(id => OLD_SKIN_MAP[id] || id))]
  .filter(id => SKINS.some(s => s.id === id));
if (!ownedSkins.includes('yingyan')) ownedSkins.push('yingyan');
curSkin = OLD_SKIN_MAP[curSkin] || curSkin;
if (!ownedSkins.includes(curSkin)) curSkin = 'yingyan';
const ITEMS = [
  {id: 'magnet', name: '金币磁铁', price: 80,  desc: '附近 70px 的金币会被吸过来'},
  {id: 'spring', name: '弹簧鞋底', price: 100, desc: '跳得更高一点'},
  {id: 'heart',  name: '生命之心', price: 120, desc: '每局多一颗心（共 3 颗）'},
  {id: 'shield', name: '月光护盾', price: 150, desc: '每局一次，坠落时自动弹回'},
];

// 写入统一走 saveLS：隐私模式等写失败时静默跳过，不炸游戏
function saveLS(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

function saveMeta() {
  saveLS('jtm_bank', bank);
  saveLS('jtm_skins', JSON.stringify(ownedSkins));
  saveLS('jtm_skin', curSkin);
  saveLS('jtm_items', JSON.stringify(ownedItems));
  saveLS('jtm_equip', JSON.stringify(equip));
  saveLS('jtm_ach', JSON.stringify(ach));
}

bestMeters = +(localStorage.getItem('jtm_best') || 0);

// ---------- 成就 ----------
// 条件在 checkAch() 统一判定；解锁立刻发金币奖励，游戏内弹横幅（队列逐个播）
const ACH = [
  {id: 'fly50',    name: '起跳！',   desc: '单局到达 50 米',           reward: 10},
  {id: 'm500',     name: '冲上云霄', desc: '单局到达 500 米',          reward: 20},
  {id: 'moon',     name: '登月成功', desc: '到达 1500 米的月亮',       reward: 50},
  {id: 'm2000',    name: '不止月亮', desc: '通关后继续飞到 2000 米',   reward: 80},
  {id: 'coin50',   name: '小富翁',   desc: '单局捡到 50 金币',         reward: 30},
  {id: 'bank500',  name: '理财大师', desc: '存款累计 500 金币',        reward: 50},
  {id: 'shopper',  name: '第一桶金', desc: '在商店买下第一件商品',     reward: 10},
  {id: 'zaplive',  name: '雷劈不死', desc: '被乌云劈中后仍活到了结算', reward: 30},
  {id: 'oneheart', name: '命悬一线', desc: '只剩一颗心时登月',         reward: 100},
  {id: 'shielded', name: '救命恩人', desc: '触发一次护盾救命',         reward: 20},
  {id: 'k3',       name: '彩蛋猎人', desc: '发现 716m 的 K3 纪念彩蛋', reward: 30},
];

function unlock(id) {
  if (ach[id]) return;
  const a = ACH.find(x => x.id === id);
  if (!a) return;
  ach[id] = true;
  bank += a.reward;
  saveMeta();
  achQueue.push(`🏆 ${a.name}  +${a.reward} 金币`);
  sfx.cheer();
}

// 登月 / 结算时各调一次；byThunder 标记是不是被电死的
function checkAch(byThunder) {
  const m = Math.floor(meters);
  if (m >= 50) unlock('fly50');
  if (m >= 500) unlock('m500');
  if (meters >= MOON_M) unlock('moon');
  if (m >= 2000) unlock('m2000');
  if (coinCount >= 50) unlock('coin50');
  if (bank >= 500) unlock('bank500');
  if (zapped && !byThunder) unlock('zaplive');
  if (meters >= MOON_M && hp === 1) unlock('oneheart');
  if (shieldSaved) unlock('shielded');
}

function renderAch() {
  const list = document.getElementById('achList');
  list.innerHTML = '';
  for (const a of ACH) {
    const got = !!ach[a.id];
    const row = document.createElement('div');
    row.className = 'shop-row';
    row.innerHTML = `<span class="shop-name">${a.name}<small>${a.desc}</small></span>`;
    const st = document.createElement('span');
    st.style.cssText = `flex:none;font-size:13px;color:${got ? '#ffd54a' : '#565f89'}`;
    st.textContent = got ? `✓ +${a.reward}` : '未解锁';
    row.appendChild(st);
    list.appendChild(row);
  }
}

// ---------- 战绩分享卡：画在离屏 canvas 上，导出 PNG ----------
function makeShareCard(m, coinsGot, wonFlag) {
  const c = document.createElement('canvas');
  c.width = 540; c.height = 720;
  const x = c.getContext('2d');
  // 深空背景 + 星星（复用主屏星空坐标，等比映射）
  let g = x.createLinearGradient(0, 0, 0, 720);
  g.addColorStop(0, '#0b1030');
  g.addColorStop(1, '#1c2450');
  x.fillStyle = g;
  x.fillRect(0, 0, 540, 720);
  x.fillStyle = 'rgba(255,255,255,.85)';
  for (const s of stars) {
    x.globalAlpha = s.p;
    x.beginPath();
    x.arc(s.x / W * 540, s.y / H * 720, s.r, 0, Math.PI * 2);
    x.fill();
  }
  x.globalAlpha = 1;
  // 月亮 + 光晕（右上）
  const mg = x.createRadialGradient(432, 128, 18, 432, 128, 112);
  mg.addColorStop(0, 'rgba(255,246,200,.55)');
  mg.addColorStop(1, 'rgba(255,246,200,0)');
  x.fillStyle = mg;

  x.fillStyle = '#f7f3d8';

  x.fillStyle = 'rgba(190,185,150,.5)';
  for (const [dx, dy, r] of [[-16, -10, 9], [13, 6, 7], [-5, 19, 5], [22, -19, 4]]) {

  // 小球：当前皮肤配色 + 同款大眼

  x.fillStyle = g;
  x.beginPath(); x.arc(bx, by, 92, 0, Math.PI * 2); x.fill();
  g = x.createRadialGradient(bx - 12, by - 14, 6, bx, by, 44);
  g.addColorStop(0, sk.c[0]);
  g.addColorStop(0.6, sk.c[1]);
  g.addColorStop(1, sk.c[2]);
  x.fillStyle = g;
  x.beginPath(); x.arc(bx, by, 42, 0, Math.PI * 2); x.fill();
  x.fillStyle = sk.eye || '#fff';
  for (const ex of [-14, 14]) {
    x.beginPath(); x.roundRect(bx + ex - 5, by - 16, 10, 19, 5); x.fill();
  }
  // 文案
  x.textAlign = 'center';
  x.fillStyle = '#e8ecf8';
  x.font = '700 22px -apple-system, sans-serif';
  x.fillText('J U M P   T O   T H E   M O O N', 270, 386);
  x.fillStyle = '#ffd54a';
  x.font = '800 76px -apple-system, sans-serif';
  x.fillText(`${m} m`, 270, 486);
  x.fillStyle = '#9aa7d0';
  x.font = '500 19px -apple-system, sans-serif';
  x.fillText(`金币 +${coinsGot} · 最高 ${bestMeters} m`, 270, 530);
  if (wonFlag) {

  x.fillText(`${ymd} · 来玩同款 ljf-0125.github.io/jump-to-the-moon/`, 270, 664);

// ---------- 音效 & 背景音乐（Web Audio 现场合成，无音频文件）----------
let AC = null, masterGain = null, bgmGain = null;
let muted = localStorage.getItem('jtm_mute') === '1';

function ensureAudio() {
  if (!AC) {
    const Ctor = window.AudioContext || window.webkitAudioContext;
    if (!Ctor) return;
    AC = new Ctor();
    masterGain = AC.createGain();
    masterGain.gain.value = muted ? 0 : 1;
    masterGain.connect(AC.destination);
    bgmGain = AC.createGain();
    bgmGain.connect(masterGain);
    startBGM();
  }
  if (AC.state === 'suspended') AC.resume();
}

// 单个合成音：频率、时长、波形、音量、滑音、延迟
function tone(freq, dur, type, gain, slide, delay) {
  if (!AC) return;
  const t0 = AC.currentTime + (delay || 0);
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0 + 0.015);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(masterGain);
  o.start(t0); o.stop(t0 + dur + 0.05);
}

function noiseBurst(dur, gain) {
  if (!AC) return;
  const len = Math.floor(AC.sampleRate * dur);
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 800;
  const g = AC.createGain(); g.gain.value = gain;
  src.connect(f); f.connect(g); g.connect(masterGain);
  src.start();
}

// 风声：循环白噪声过带通滤波，音量随风力淡入淡出（进/出风带时调用）
let windSrc = null, windGain = null;
function setWindAudio(v) {
  if (!AC) return;
  if (!windSrc) {
    const len = AC.sampleRate * 2;
    const buf = AC.createBuffer(1, len, AC.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    windSrc = AC.createBufferSource();
    windSrc.buffer = buf; windSrc.loop = true;
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 500; f.Q.value = 0.6;
    windGain = AC.createGain(); windGain.gain.value = 0;
    windSrc.connect(f); f.connect(windGain); windGain.connect(masterGain);
    windSrc.start();
  }
  windGain.gain.setTargetAtTime(v * 0.05, AC.currentTime, 0.3);
}

const sfx = {

  crack()  { tone(180, 0.10, 'square', 0.10, 90); noiseBurst(0.1, 0.15); },
  coin()   { tone(988, 0.07, 'square', 0.09); tone(1319, 0.16, 'square', 0.09, null, 0.06); },
  shield() { tone(520, 0.25, 'triangle', 0.18, 1040); },

// 背景音乐：C 大调慢板，垫底和弦 + 五声音阶随机拨音
const CHORDS = [
  [261.6, 329.6, 392.0],  // C
  [220.0, 261.6, 329.6],  // Am
  [174.6, 220.0, 261.6],  // F
  [196.0, 246.9, 293.7],  // G
];
const PENTA = [261.6, 293.7, 329.6, 392.0, 440.0, 523.3, 587.3];
let bgmNext = 0, bgmBeat = 0;

function startBGM() {
  bgmNext = AC.currentTime + 0.1;
  bgmBeat = 0;
  setInterval(scheduleBGM, 150);
}

function scheduleBGM() {
  if (!AC || AC.state !== 'running') return;
  while (bgmNext < AC.currentTime + 0.4) {
    const t = bgmNext;
    if (bgmBeat % 4 === 0) padChord(CHORDS[Math.floor(bgmBeat / 4) % CHORDS.length], t);
    if (bgmBeat % 2 === 1 && Math.random() < 0.6) pluck(PENTA[(Math.random() * PENTA.length) | 0], t);
    bgmNext += 0.6;
    bgmBeat++;
  }
}

function padChord(freqs, t) {
  for (const f of freqs) {
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'triangle';
    o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.035, t + 0.6);
    g.gain.linearRampToValueAtTime(0.0001, t + 2.4);
    o.connect(g); g.connect(bgmGain);
    o.start(t); o.stop(t + 2.5);
  }
}

function pluck(f, t) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = 'sine';
  o.frequency.value = f;
  g.gain.setValueAtTime(0.06, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + 0.55);
  o.connect(g); g.connect(bgmGain);
  o.start(t); o.stop(t + 0.6);
}

// 教学局主循环：只保留移动/弹跳物理，无乌云无风无金币，掉了弹回（死不了）
function updateTutorial() {
  prevCamY = camY; prevBallX = ball.x; prevBallY = ball.y;   // 渲染插值：本步起点快照
  frame++;
  const left = keys.left || touchDir < 0;
  const right = keys.right || touchDir > 0;
  if (left) ball.vx -= 0.65;
  if (right) ball.vx += 0.65;
  if (!left && !right) ball.vx *= 0.86;
  ball.vx = Math.max(-5.2, Math.min(5.2, ball.vx));
  const prevBottom = ball.y + ball.r;
  ball.vy += (curSkin === 'zhui' && ball.vy > 0) ? ZHUI_FALL_G : 0.35;   // 缓刑在教学局同样生效
  ball.x += ball.vx;
  ball.y += ball.vy;
  if (ball.x < -ball.r) ball.x = W + ball.r;
  if (ball.x > W + ball.r) ball.x = -ball.r;

  if (ball.vy > 0) {
    for (const p of platforms) {
      if (p.gone) continue;
      if (prevBottom <= p.y && ball.y + ball.r >= p.y &&
          ball.x > p.x - ball.r * 0.6 && ball.x < p.x + p.w + ball.r * 0.6) {
        ball.y = p.y - ball.r;
        ball.vy = bounceV;
        squashT = 6;
        sfx.bounce();
        if (tutStep === 1 && !p.ground) tutCount++;
        break;
      }
    }
  }
  if (squashT > 0) squashT--;

  // 掉出屏幕：教学专属保护，弹回来接着练
  if (ball.y - camY > H + 50) {
    ball.y = camY + H * 0.55;
    ball.vy = bounceV;
    ball.vx = 0;
    sfx.shield();
  }
  // 只有第 2 步相机才上滚
  if (tutStep === 1 && ball.y - camY < H * 0.35) camY = ball.y - H * 0.35;

  // 步骤推进
  if (tutStep === 0) {
    tutMinX = Math.min(tutMinX, ball.x);
    tutMaxX = Math.max(tutMaxX, ball.x);
    if (startX - tutMinX >= 60 && tutMaxX - startX >= 60) {
      tutStep = 1;
      setupTutJump();
      sfx.cheer();
    }
  } else if (tutStep === 1 && tutCount >= 5) {
    tutStep = 2;
    sfx.cheer();
  }
}

// 风带查询：m 高度在第几片风带里（-1 = 无风）
function windBandAt(m) {
  if (m < WIND_START_M) return -1;
  const i = Math.floor(m / WIND_EVERY_M) - 1;
  return (m - (i + 1) * WIND_EVERY_M < WIND_THICK_M) ? i : -1;
}

// 风带参数：方向（每局随机）+ 风力（按片数递增）
function windAt(m) {
  const i = windBandAt(m);
  if (i < 0) return null;
  while (windDirs.length <= i) windDirs.push(Math.random() < 0.5 ? -1 : 1);
  return {dir: windDirs[i], v: WIND_V[Math.min(i, WIND_V.length - 1)], i};
}

// 风带预警：距下一片风带底部 <= WIND_WARN_M 且在带外时，返回那片风的参数（否则 null）
function windApproach(m) {
  if (windBandAt(m) >= 0) return null;
  const bottom = (Math.floor(m / WIND_EVERY_M) + 1) * WIND_EVERY_M;
  return (bottom - m <= WIND_WARN_M) ? windAt(bottom) : null;
}

// 逐帧估算从高度 m0 上升 gap(px) 这一跳的风漂移总量（px），模型与 update() 完全一致
// （含漂移爬升和离开风带后的拖尾），生成器靠它把云放到漂移终点
function windDriftEst(m0, gap) {
  const tFly = (11.2 + Math.sqrt(Math.max(0, 125.44 - 0.7 * gap))) / 0.35;
  let dv = 0, total = 0;
  for (let t = 0; t < tFly; t++) {
    const y = 11.2 * t - 0.175 * t * t;
    const w = windAt(m0 + y / PX_PER_M);
    dv += ((w ? w.dir * w.v : 0) - dv) * 0.08;
    total += dv;
  }
  return total;
}

// 难度区间：0–200m 简单，200–400m 中等，400–800m 过渡，800m+ 困难
function difficulty() {
  if (meters < 200) {
    return {gapMin: 60, gapMax: 85, dxMax: 130, wMin: 72, wVar: 16, pMove: 0, pBreak: 0, vMove: 0.8, pHaz: 0, pSpring: 0.05};
  } else if (meters < 400) {
    return {gapMin: 70, gapMax: 100, dxMax: 155, wMin: 66, wVar: 14, pMove: 0.20, pBreak: 0, vMove: 1.1, pHaz: 0.06, pSpring: 0.05};
  } else if (meters < 800) {
    const t = (meters - 400) / 400;
    return {
      gapMin: 70 + 15 * t, gapMax: 100 + 15 * t,
      dxMax: 155 + 20 * t,
      wMin: 66 - 8 * t, wVar: 14 - 2 * t,
      pMove: 0.20 + 0.10 * t, pBreak: 0.12 * t, vMove: 1.1 + 0.7 * t,
      pHaz: 0.06 + 0.04 * t, pSpring: 0.05,
    };
  }
  return {gapMin: 85, gapMax: 115, dxMax: 175, wMin: 58, wVar: 12, pMove: 0.30, pBreak: 0.12, vMove: 1.8, pHaz: 0.10, pSpring: 0.05};
}

function ensurePlatforms() {
  while (nextPlatY > camY - 120) {
    const D = difficulty();
    const gap = D.gapMin + Math.random() * (D.gapMax - D.gapMin);
    nextPlatY -= gap;
    const w = D.wMin + Math.random() * D.wVar;
    // 水平偏移：之字形展开；上限 = 这一跳物理可达距离(留 30% 余量) − 两朵云宽度
    const prev = platforms[platforms.length - 1];
    const prevCx = prev ? prev.x + prev.w / 2 : W / 2;
    const prevW = prev ? prev.w : w;
    const tFly = (11.2 + Math.sqrt(Math.max(0, 125.44 - 0.7 * gap))) / 0.35; // 上升 gap 后落回同高度的总帧数
    const reach = 0.7 * (5.2 * Math.max(0, tFly - 8) + 20.8);                // 横移：极速 5.2、加速段 8 帧/20.8px
    const dxMax = Math.max(18, Math.min(D.dxMax, reach - (w + prevW) / 2 - 8));
    const dxMin = Math.min(30, dxMax * 0.6);
    // 风带补偿：逐帧模拟这一跳的真实漂移，云的落点中心放在漂移终点（±22px 抖动）——
    // 蔚蓝式：顺风是天然路径，顶风靠操作补
    const prevM = (GROUND_Y - (prev ? prev.y : GROUND_Y)) / PX_PER_M;
    const drift = windDriftEst(prevM, gap);
    const wMid = windAt(prevM + gap / PX_PER_M / 2);
    const dx = drift !== 0
      ? drift + (Math.random() * 44 - 22)
      : (Math.random() < 0.5 ? -1 : 1) * (dxMin + Math.random() * (dxMax - dxMin));
    let cx = prevCx + dx;
    cx = ((cx % W) + W) % W; // 左右穿屏环绕
    const x = Math.max(8, Math.min(W - 8 - w, cx - w / 2));
    let type = 'n', vx = 0;
    const r = Math.random();
    if (r < D.pBreak) type = 'b';
    else if (r < D.pBreak + D.pMove) {
      type = 'm';
      vx = (Math.random() < 0.5 ? -1 : 1) * D.vMove * (0.7 + Math.random() * 0.6);
    } else if (r < D.pBreak + D.pMove + D.pSpring) type = 'g';
    platforms.push({x, y: nextPlatY, w, type, vx, gone: false});
    // 35% 概率在云朵上方飘一枚金币；没出金币时 12% 概率换成限时道具（含回血红心）
    if (Math.random() < 0.35) {
      coins.push({
        x: x + w / 2 + (Math.random() * 32 - 16),
        y: nextPlatY - 34 - Math.random() * 16,
        ph: Math.random() * Math.PI * 2,
        taken: false,
      });
    } else if (Math.random() < 0.12) {
      powerups.push({
        x: x + w / 2 + (Math.random() * 24 - 12),
        y: nextPlatY - 38 - Math.random() * 14,
        kind: ['magnet', 'spring', 'shield', 'heart'][(Math.random() * 4) | 0],
        ph: Math.random() * Math.PI * 2,
        taken: false,
      });
    }
    // 200m 以上按难度概率刷乌云，飘在两朵云之间的空隙里；风带里不刷（漂移中躲不了，不公平）
    if (!wMid && D.pHaz && Math.random() < D.pHaz) {
      hazards.push({
        x: 8 + Math.random() * (W - 86),
        y: nextPlatY + gap * 0.5,
        w: 70,
        vx: (Math.random() < 0.5 ? -1 : 1) * (1.2 + Math.random() * 0.8),
      });
    }
  }
  // 清理已碎和掉出屏幕底部的平台
  platforms = platforms.filter(p => !p.gone && p.y - camY < H + 60);
  coins = coins.filter(c => !c.taken && c.y - camY < H + 60);
  powerups = powerups.filter(p => !p.taken && p.y - camY < H + 60);
  hazards = hazards.filter(h => h.y - camY < H + 60);
}

function update() {
  if (screen === 'tutorial') { updateTutorial(); return; }
  if (screen !== 'game' || dead) return;
  prevCamY = camY; prevBallX = ball.x; prevBallY = ball.y;   // 渲染插值：本步起点快照
  frame++;
  for (const k in temp) if (temp[k] > 0) temp[k]--;   // 限时道具倒计时
  if (invincibleT > 0) invincibleT--;

  // 水平控制
  const left = keys.left || touchDir < 0;
  const right = keys.right || touchDir > 0;
  if (left) ball.vx -= 0.65;
  if (right) ball.vx += 0.65;
  if (!left && !right) ball.vx *= 0.86;
  ball.vx = Math.max(-5.2, Math.min(5.2, ball.vx));

  const prevBottom = ball.y + ball.r;
  ball.vy += (curSkin === 'zhui' && ball.vy > 0) ? ZHUI_FALL_G : 0.35;   // 缓刑：下坠变慢
  ball.x += ball.vx;
  // 持续风：空中随风漂移（独立位移项，不动 5.2/0.65 手感）；出风带后平滑归零
  const wNow = windAt(meters);
  windDrift += ((wNow ? wNow.dir * wNow.v : 0) - windDrift) * 0.08;
  ball.x += windDrift;
  ball.y += ball.vy;

  // 左右穿屏
  if (ball.x < -ball.r) ball.x = W + ball.r;
  if (ball.x > W + ball.r) ball.x = -ball.r;

  // 进/出风带：弹横幅 + 风声淡入淡出
  const bi = wNow ? wNow.i : -1;
  if (bi !== lastBand) {
    if (bi >= 0) {
      windBandText = `起风了 · ${['微风', '大风', '狂风'][Math.min(bi, 2)]} ${wNow.dir > 0 ? '→' : '←'}`;
      windBandT = 120;
    }
    setWindAudio(wNow ? wNow.v : 0);
    lastBand = bi;
  }
  if (windBandT > 0) windBandT--;
  // 风带预警：进带前 WIND_WARN_M 米先弹「前方起风」，风声隐约渐起
  if (bi >= 0) lastApproach = -1;
  else {
    const wa = windApproach(meters);
    const ai = wa ? wa.i : -1;
    if (ai !== lastApproach) {
      lastApproach = ai;
      if (ai >= 0) {
        windBandText = `前方起风 · ${['微风', '大风', '狂风'][Math.min(ai, 2)]} ${wa.dir > 0 ? '→' : '←'}`;
        windBandT = 120;
        setWindAudio(wa.v * 0.35);
      }
    }
  }

  // 移动平台：全屏往返漂移；碎云被踩后抖 14 帧再碎（断云预警）
  for (const p of platforms) {
    if (p.type === 'm') {
      p.x += p.vx;
      if (p.x < 8 || p.x + p.w > W - 8) p.vx *= -1;
    }
    if (p.shake > 0 && --p.shake === 0) p.gone = true;
  }

  // 乌云：往返漂移，碰到掉一颗心（心没了才死）；即将进入屏幕时预警一次
  for (const h of hazards) {
    h.x += h.vx;
    if (h.x < 8 || h.x + h.w > W - 8) h.vx *= -1;
    const hsy = h.y - camY;
    if (!h.warned && hsy < 0 && hsy > -HAZ_WARN) { h.warned = true; sfx.thunder(); }
    if (invincibleT === 0 &&
        Math.abs(ball.x - (h.x + h.w / 2)) < h.w / 2 * 0.85 + ball.r * 0.55 &&
        Math.abs(ball.y - (h.y + 11)) < 12 + ball.r * 0.55) {
      hp--;
      if (hp <= 0) {
        die('被乌云电到了', true);
        return;
      }
      zapped = true;   // 成就：被劈后还活着
      invincibleT = 90;   // 掉心后 1.5 秒无敌，球闪烁，防止一朵云连劈
      sfx.hurt();
    }
  }

  // 下落时踩平台
  if (ball.vy > 0) {
    for (const p of platforms) {
      if (p.gone) continue;
      if (prevBottom <= p.y && ball.y + ball.r >= p.y &&
          ball.x > p.x - ball.r * 0.6 && ball.x < p.x + p.w + ball.r * 0.6) {
        ball.y = p.y - ball.r;
        windDrift = 0;   // 落地后漂移清零，下一跳重新起算
        if (p.type === 'g') {          // 弹簧云：弹射超高，附带 1 秒无敌
          ball.vy = -17;
          squashT = 10;
          invincibleT = 60;
          sfx.spring();
        } else {
          ball.vy = temp.spring > 0 ? -12.2 : bounceV;
          squashT = 6;
          sfx.bounce();
          if (p.type === 'b' && !p.shake) { p.shake = 14; sfx.crack(); }  // 碎云先晃后碎
        }
        if (curSkin === 'zhejing') {   // 利滚利：每踩满 10 朵云 +1 金币
          combo++;
          if (combo % 10 === 0) { coinCount++; skillToast('利滚利 +1 金币'); sfx.coin(); }
        }
        break;
      }
    }
  }

  // 拾取金币（磁铁会把附近的金币吸过来）
  for (const c of coins) {
    if (c.taken) continue;
    const cdx = ball.x - c.x, cdy = ball.y - c.y;
    const cd = Math.hypot(cdx, cdy);
    if ((equip.magnet || temp.magnet > 0) && cd < 70 && cd > 1) { c.x += cdx * 0.18; c.y += cdy * 0.18; }
    if (cd < ball.r + 7) {
      c.taken = true;
      coinCount++;
      sfx.coin();
    }
  }

  // 拾取限时道具：磁铁/弹簧/护盾生效 10 秒（护盾在时限内坠落救命一次）；红心立即回一颗心
  for (const p of powerups) {
    if (p.taken) continue;
    if (Math.hypot(ball.x - p.x, ball.y - p.y) < ball.r + 11) {
      p.taken = true;
      if (p.kind === 'heart') {
        hp = Math.min(maxHp, hp + 1);
        sfx.heal();
      } else {
        temp[p.kind] = PU_TIME;
        sfx.power();
      }
    }
  }

  // 相机只向上滚
  if (ball.y - camY < H * 0.35) camY = ball.y - H * 0.35;

  // 高度 & 计分
  maxAlt = Math.max(maxAlt, GROUND_Y - ball.y);
  meters = maxAlt / PX_PER_M;
  if (!won && meters >= MOON_M) { won = true; wonT = 240; sfx.win(); checkAch(false); }
  if (wonT > 0) wonT--;
  // 里程碑：每 500m 弹横幅庆祝（1500m 交给登月横幅）
  if (meters >= nextMilestone) {
    if (nextMilestone !== MOON_M) {
      milestoneText = `${nextMilestone} m！`;
      milestoneT = 150;
      sfx.cheer();
    }
    nextMilestone += 500;
  }
  if (milestoneT > 0) milestoneT--;
  // 成就横幅：队列逐个播
  if (achT > 0) achT--;
  else if (achQueue.length) { achText = achQueue.shift(); achT = 150; }
  if (skillT > 0) skillT--;

  // 716m 彩蛋：K3 发布纪念（2026.07.16），彩带烟花 + 纪念横幅
  if (!k3Done && meters >= 716) {
    k3Done = true;
    k3T = 200;
    sfx.k3();
    unlock('k3');   // 成就：彩蛋猎人
    const colors = ['#ffd54a', '#5b8ff5', '#f58f8f', '#93e07d', '#e0ccff'];
    for (let i = 0; i < 60; i++) {
      const a = Math.random() * Math.PI * 2, v = 1 + Math.random() * 2.6;
      k3Fx.push({
        x: W / 2 + (Math.random() - 0.5) * 160,
        y: camY + 110 + (Math.random() - 0.5) * 60,
        vx: Math.cos(a) * v, vy: Math.sin(a) * v - 1,
        c: colors[i % colors.length], life: 90 + Math.random() * 60,
      });
    }
  }
  if (k3T > 0) k3T--;
  for (const p of k3Fx) { p.x += p.vx; p.y += p.vy; p.vy += 0.03; p.life--; }
  k3Fx = k3Fx.filter(p => p.life > 0);

  ensurePlatforms();

  if (squashT > 0) squashT--;

  // 掉出屏幕：限时盾（不用就过期）→ 等价交换盾 → 月光护盾，都没有就结算
  // （红球「死与税」在 die() 里兜底——盾确实用完了才会收税）
  if (ball.y - camY > H + 50) {
    if (temp.shield > 0 || shieldCharges > 0 || (equip.shield && !shieldUsed)) {
      if (temp.shield > 0) temp.shield = 0;
      else if (shieldCharges > 0) shieldCharges--;
      else shieldUsed = true;
      shieldSaved = true;   // 成就：护盾救命
      ball.y = camY + H * 0.55;
      ball.vy = temp.spring > 0 ? -12.2 : bounceV;
      ball.vx = 0;
      sfx.shield();
    } else {
      die();
    }
  }
}

// ---------- 绘制 ----------

function hexMix(c1, c2, t) {
  const a = [1, 3, 5].map(i => parseInt(c1.substr(i, 2), 16));
  const b = [1, 3, 5].map(i => parseInt(c2.substr(i, 2), 16));
  const c = a.map((v, i) => Math.round(v + (b[i] - v) * t));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

function hexA(hex, a) {
  const r = parseInt(hex.substr(1, 2), 16), g = parseInt(hex.substr(3, 2), 16), b = parseInt(hex.substr(5, 2), 16);
  return `rgba(${r},${g},${b},${a})`;
}

const SKY = [
  [0,    '#8ec5fc', '#e8f6ff'],
  [600,  '#7c6bb8', '#d3a6d9'],
  [1200, '#0b1030', '#1c2450'],
  [2200, '#04060e', '#0a0e24'],
];
function skyColors(m) {
  let i = 0;
  while (i < SKY.length - 2 && m > SKY[i + 1][0]) i++;
  const [m0, t0, b0] = SKY[i], [m1, t1, b1] = SKY[i + 1];
  const t = Math.min(1, Math.max(0, (m - m0) / (m1 - m0)));
  return [hexMix(t0, t1, t), hexMix(b0, b1, t)];
}

function drawBackground() {
  const [top, bottom] = skyColors(meters);
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, top);
  g.addColorStop(1, bottom);
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);

  // 星星：500 米后逐渐显现
  const alpha = Math.min(1, Math.max(0, (meters - 400) / 500));
  if (alpha > 0) {
    ctx.fillStyle = `rgba(255,255,255,${0.85 * alpha})`;
    for (const s of stars) {
      const y = ((s.y + camY * s.p) % H + H) % H;
      ctx.beginPath();
      ctx.arc(s.x, y, s.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  // 月亮（终点）
  const moonY = GROUND_Y - MOON_M * PX_PER_M;
  const sy = moonY - camY;
  if (sy > -160 && sy < H + 160) {
    // 光晕用径向渐变，不用 shadowBlur（手机性能）
    const mg = ctx.createRadialGradient(W / 2, sy, 40, W / 2, sy, 150);
    mg.addColorStop(0, 'rgba(255,246,200,0.55)');
    mg.addColorStop(1, 'rgba(255,246,200,0)');
    ctx.fillStyle = mg;
    ctx.beginPath();
    ctx.arc(W / 2, sy, 150, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#f7f3d8';
    ctx.beginPath();
    ctx.arc(W / 2, sy, 70, 0, Math.PI * 2);
    ctx.fill();
    // 陨石坑
    ctx.fillStyle = 'rgba(190,185,150,0.5)';
    for (const [cx, cy, cr] of [[-22, -14, 12], [18, 8, 9], [-6, 26, 7], [30, -26, 6]]) {
      ctx.beginPath();
      ctx.arc(W / 2 + cx, sy + cy, cr, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function drawCloud(p, y) {
  const pal = {
    n: ['#ffffff', '#dde7f5'],  // 普通云：白
    m: ['#e8f5ff', '#a9d6f7'],  // 移动云：淡蓝
    b: ['#f3e0c3', '#d9b08c'],  // 碎云：棕
    d: ['#7a7f9c', '#40455f'],  // 乌云：深灰蓝（危险）
    g: ['#e8f9cd', '#7ed68a'],  // 弹簧云：嫩绿
  }[p.type];
  // 淡淡的投影
  ctx.fillStyle = 'rgba(30,50,90,0.10)';
  ctx.beginPath();
  ctx.ellipse(p.x + p.w / 2, y + 22, p.w / 2 - 5, 4, 0, 0, Math.PI * 2);
  ctx.fill();
  // 云身：三个圆包叠成，竖直渐变，没有直角边；乌云带一圈电光晕
  const g = ctx.createLinearGradient(0, y - 5, 0, y + 20);
  g.addColorStop(0, pal[0]);
  g.addColorStop(1, pal[1]);
  if (p.type === 'd') { // 电光晕：径向渐变，不用 shadowBlur（性能）
    const hg = ctx.createRadialGradient(p.x + p.w / 2, y + 11, 4, p.x + p.w / 2, y + 11, p.w * 0.75);
    hg.addColorStop(0, 'rgba(90,95,140,.5)');
    hg.addColorStop(1, 'rgba(90,95,140,0)');
    ctx.fillStyle = hg;
    ctx.beginPath();
    ctx.ellipse(p.x + p.w / 2, y + 11, p.w * 0.75, 24, 0, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(p.x + p.w * 0.25, y + 11, 9.5, 0, Math.PI * 2);
  ctx.arc(p.x + p.w * 0.50, y + 8, 13, 0, Math.PI * 2);
  ctx.arc(p.x + p.w * 0.75, y + 11, 9.5, 0, Math.PI * 2);
  ctx.roundRect(p.x + p.w * 0.25 - 9.5, y + 11, p.w * 0.5 + 19, 8, 4);
  ctx.fill();
  if (p.type === 'b') { // 碎云的裂纹
    ctx.strokeStyle = 'rgba(120,80,40,0.5)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(p.x + p.w * 0.35, y + 3);
    ctx.lineTo(p.x + p.w * 0.5, y + 16);
    ctx.lineTo(p.x + p.w * 0.65, y + 5);
    ctx.stroke();
  }
  if (p.type === 'd') { // 乌云画一道小闪电，提示危险
    ctx.fillStyle = '#ffd54a';
    ctx.beginPath();
    const lx = p.x + p.w / 2, ly = y + 9;
    ctx.moveTo(lx + 2.5, ly - 7);
    ctx.lineTo(lx - 3, ly + 2.5);
    ctx.lineTo(lx + 0.5, ly + 2.5);
    ctx.lineTo(lx - 2.5, ly + 10);
    ctx.lineTo(lx + 4.5, ly - 1);
    ctx.lineTo(lx + 0.5, ly - 1);
    ctx.closePath();
    ctx.fill();
  }
  if (p.type === 'g') { // 弹簧云：顶上画三层白色线圈
    ctx.strokeStyle = 'rgba(255,255,255,.95)';
    ctx.lineWidth = 1.6;
    const gx = p.x + p.w / 2;
    for (const [gy, grx] of [[-1, 7], [-5, 5.5], [-9, 4]]) {
      ctx.beginPath();
      ctx.ellipse(gx, y + gy, grx, 2, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
  }
}

function drawPlatforms() {
  for (const p of platforms) {
    if (p.gone) continue;
    const y = p.y - camY;
    if (y < -30 || y > H + 30) continue;
    if (p.shake > 0) {  // 碎云抖动预警
      drawCloud({...p, x: p.x + Math.sin(frame * 2.1) * 1.6 * (p.shake / 14)}, y);
    } else {
      drawCloud(p, y);
    }
  }
}

function drawHazards() {
  for (const h of hazards) {
    const y = h.y - camY;
    if (y < -30 || y > H + 30) continue;
    drawCloud({x: h.x, w: h.w, type: 'd'}, y);
  }
}

// 风线：风带内斜向流动，数量/长度/速度随风力（纯 frame 驱动，无额外状态）
function drawWind() {
  const w = windAt(meters);
  if (!w) return;
  ctx.strokeStyle = meters > 900 ? 'rgba(255,255,255,.30)' : 'rgba(80,100,145,.32)';
  ctx.lineWidth = 1.6;
  const n = 8 + Math.min(w.i, 2) * 5;
  const speed = (4 + 2.5 * w.v) * w.dir;
  const len = 12 + 6 * w.v;
  for (let k = 0; k < n; k++) {
    const sx = ((k * 97 + frame * speed) % (W + 90) + W + 90) % (W + 90) - 45;
    const sy = (k * 53) % H;
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx - w.dir * len, sy + 3);
    ctx.stroke();
  }
}

// 716m 彩蛋彩带：世界坐标，随镜头留在原地
function drawK3() {
  for (const p of k3Fx) {
    ctx.globalAlpha = Math.min(1, p.life / 40);
    ctx.fillStyle = p.c;
    ctx.fillRect(p.x - 2, p.y - camY - 2, 4, 4);
  }
  ctx.globalAlpha = 1;
}

function drawBall() {
  const sq = squashT / 6; // 1 → 0
  ctx.save();
  if (invincibleT > 0) ctx.globalAlpha = 0.55 + 0.45 * Math.sin(frame * 0.4);   // 无敌时闪烁
  ctx.translate(ball.x, ball.y - camY);
  ctx.scale(1 + 0.25 * sq, 1 - 0.22 * sq);

  // 球体：角色配色；光晕用径向渐变，不用 shadowBlur（手机性能）
  const sk = SKINS.find(s => s.id === curSkin) || SKINS[0];
  const gl = ctx.createRadialGradient(0, 0, ball.r * 0.5, 0, 0, ball.r * 2.2);
  gl.addColorStop(0, hexA(sk.c[1], 0.5));
  gl.addColorStop(1, hexA(sk.c[1], 0));
  ctx.fillStyle = gl;
  ctx.beginPath();
  ctx.arc(0, 0, ball.r * 2.2, 0, Math.PI * 2);
  ctx.fill();
  const g = ctx.createRadialGradient(-5, -7, 3, 0, 0, ball.r + 2);
  g.addColorStop(0, sk.c[0]);
  g.addColorStop(0.6, sk.c[1]);
  g.addColorStop(1, sk.c[2]);
  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(0, 0, ball.r, 0, Math.PI * 2);
  ctx.fill();

  // 两只眼睛，朝移动方向看（折镜是白球，用深色眼睛）
  const look = Math.max(-1, Math.min(1, ball.vx / 4)) * 2.5;
  ctx.fillStyle = sk.eye || '#fff';
  for (const ex of [-5.5, 5.5]) {
    ctx.beginPath();
    ctx.roundRect(ex - 2.1 + look, -6, 4.2, 7.5, 2.1);
    ctx.fill();
  }
  ctx.restore();
}

function drawHUD() {
  ctx.fillStyle = meters > 900 ? 'rgba(255,255,255,0.92)' : 'rgba(30,40,70,0.75)';
  ctx.font = '600 20px -apple-system, sans-serif';
  ctx.textAlign = 'left';
  ctx.fillText(`${Math.floor(meters)} m`, 14, 32);
  // 血量：高度旁边一排心，实心=剩余，空心=已损失
  for (let i = 0; i < maxHp; i++) drawHeart(114 + i * 24, 25, i < hp);
  // 等价交换的无时限盾：小蓝盾 + 剩余次数
  if (shieldCharges > 0) {
    const sx = 122 + maxHp * 24;
    ctx.fillStyle = '#3f9fd8';
    ctx.beginPath(); ctx.arc(sx, 25, 8, 0, Math.PI * 2); ctx.fill();
    drawPowerupIcon('shield', sx, 25, 0.62, '#3f9fd8');
    ctx.fillStyle = meters > 900 ? 'rgba(255,255,255,0.92)' : 'rgba(30,40,70,0.75)';
    ctx.font = '600 13px -apple-system, sans-serif';
    ctx.fillText(`×${shieldCharges}`, sx + 11, 29);
  }
  // 金币计数
  drawCoin(20, 53, 1);
  ctx.fillStyle = meters > 900 ? 'rgba(255,255,255,0.92)' : 'rgba(30,40,70,0.75)';
  ctx.font = '600 15px -apple-system, sans-serif';
  ctx.fillText(String(coinCount), 33, 58);
  // 生效中的限时道具：图标 + 倒计时进度条
  let hy = 86;
  for (const k of ['magnet', 'spring', 'shield']) {
    if (temp[k] > 0) {
      const st = PU_STYLE[k];
      ctx.fillStyle = st.c[1];
      ctx.beginPath(); ctx.arc(18, hy, 8, 0, Math.PI * 2); ctx.fill();
      drawPowerupIcon(k, 18, hy, 0.62, st.c[1]);
      // 进度条：随剩余时间缩短
      const bw = 58 * (temp[k] / PU_TIME);
      ctx.fillStyle = meters > 900 ? 'rgba(255,255,255,0.25)' : 'rgba(30,40,70,0.18)';
      ctx.beginPath(); ctx.roundRect(32, hy - 3, 58, 6, 3); ctx.fill();
      if (bw > 0.5) {
        ctx.fillStyle = st.c[1];
        ctx.beginPath(); ctx.roundRect(32, hy - 3, bw, 6, Math.min(3, bw / 2)); ctx.fill();
      }
      hy += 22;
    }
  }
  ctx.font = '12px -apple-system, sans-serif';
  ctx.textAlign = 'right';
  ctx.fillText(`最高 ${bestMeters} m`, W - 14, 30);
  // 风向指示：1~3 个小三角指向风向，越多风越大
  const wHud = windAt(meters);
  if (wHud) {
    ctx.fillStyle = meters > 900 ? 'rgba(255,255,255,.8)' : 'rgba(30,40,70,.55)';
    const n = Math.min(wHud.i, 2) + 1;
    for (let k = 0; k < n; k++) {
      const ax = wHud.dir > 0 ? W - 50 + k * 13 : W - 20 - k * 13;
      ctx.beginPath();
      ctx.moveTo(ax + 6 * wHud.dir, 52);
      ctx.lineTo(ax - 3 * wHud.dir, 47);
      ctx.lineTo(ax - 3 * wHud.dir, 57);
      ctx.closePath();
      ctx.fill();
    }
  } else {
    // 风带预警：顶部居中蓝色风向箭头，常闪到进场（乌云红三角同款逻辑）
    const wa = windApproach(meters);
    if (wa) {
      const pulse = 0.55 + 0.45 * Math.sin(frame * 0.25);
      ctx.fillStyle = `rgba(110,180,255,${pulse})`;
      const n = Math.min(wa.i, 2) + 1;
      for (let k = 0; k < n; k++) {
        const ax = W / 2 + (k - (n - 1) / 2) * 13;
        ctx.beginPath();
        ctx.moveTo(ax + 6 * wa.dir, 52);
        ctx.lineTo(ax - 3 * wa.dir, 47);
        ctx.lineTo(ax - 3 * wa.dir, 57);
        ctx.closePath();
        ctx.fill();
      }
    }
  }

  if (wonT > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, wonT / 40);
    ctx.fillStyle = '#fff7c9';
    ctx.font = '600 24px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('到达月球！', W / 2, 110);
    ctx.font = '14px -apple-system, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillText('继续向上，看看还能飞多高', W / 2, 136);
    ctx.restore();
  }

  // 里程碑横幅：弹出后停留渐隐
  if (milestoneT > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, milestoneT / 30);
    const pop = 1 + 0.18 * Math.max(0, milestoneT - 130) / 20;
    ctx.fillStyle = '#ffe9a8';
    ctx.font = `700 ${Math.round(26 * pop)}px -apple-system, sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText(milestoneText, W / 2, 170);
    ctx.restore();
  }

  // 风带进场横幅
  if (windBandT > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, windBandT / 30);
    ctx.fillStyle = meters > 900 ? '#bfe3ff' : 'rgba(60,80,130,.85)';
    ctx.font = '600 17px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(windBandText, W / 2, 240);
    ctx.restore();
  }

  // 技能触发横幅
  if (skillT > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, skillT / 30);
    ctx.fillStyle = '#9ec2ff';
    ctx.font = '600 16px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(skillText, W / 2, 275);
    ctx.restore();
  }

  // 成就解锁横幅
  if (achT > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, achT / 30);
    ctx.fillStyle = '#ffd54a';
    ctx.font = '600 16px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(achText, W / 2, 205);
    ctx.restore();
  }

  // 716m K3 彩蛋横幅
  if (k3T > 0) {
    ctx.save();
    ctx.globalAlpha = Math.min(1, k3T / 40);
    ctx.fillStyle = '#ffd54a';
    ctx.font = '700 24px -apple-system, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('K3 发布纪念 🎉', W / 2, 120);
    ctx.font = '13px -apple-system, sans-serif';
    ctx.fillStyle = 'rgba(255,233,168,.9)';
    ctx.fillText('2026.07.16', W / 2, 142);
    ctx.restore();
  }

  // 乌云预警：触发后三角一直闪到乌云进场
  for (const h of hazards) {
    const hsy = h.y - camY;
    if (!h.warned || hsy >= 0) continue;
    const ax = Math.max(20, Math.min(W - 20, h.x + h.w / 2));
    const pulse = 0.55 + 0.45 * Math.sin(frame * 0.25);
    ctx.fillStyle = `rgba(255,90,90,${pulse})`;
    ctx.beginPath();
    ctx.moveTo(ax, 58);
    ctx.lineTo(ax - 8, 46);
    ctx.lineTo(ax + 8, 46);
    ctx.closePath();
    ctx.fill();
  }
}

// 金币预渲染成贴图：渐变 + 光晕只画一次，之后每帧 drawImage（shadowBlur 逐帧太贵）
const COIN_S = 4;   // 贴图超采样倍数
const coinSprite = document.createElement('canvas');
coinSprite.width = coinSprite.height = (7 * 2 + 8) * COIN_S;   // 币身 + 光晕边距
(function renderCoinSprite() {
  const c = coinSprite.getContext('2d');
  const r = 7 * COIN_S, cx = coinSprite.width / 2, cy = coinSprite.height / 2;
  // 光晕
  let g = c.createRadialGradient(cx, cy, r * 0.4, cx, cy, r + 3.5 * COIN_S);
  g.addColorStop(0, 'rgba(255,213,74,0.5)');
  g.addColorStop(1, 'rgba(255,213,74,0)');
  c.fillStyle = g;
  c.fillRect(0, 0, coinSprite.width, coinSprite.height);
  // 币身：径向渐变，左上受光
  g = c.createRadialGradient(cx - 2.5 * COIN_S, cy - 3 * COIN_S, COIN_S, cx, cy, r);
  g.addColorStop(0, '#fff6c4');
  g.addColorStop(0.55, '#ffd54a');
  g.addColorStop(1, '#cf9a1a');
  c.fillStyle = g;
  c.beginPath(); c.arc(cx, cy, r, 0, Math.PI * 2); c.fill();
  // 内圈压边
  c.strokeStyle = 'rgba(150,102,10,0.8)';
  c.lineWidth = 1.1 * COIN_S;
  c.beginPath(); c.arc(cx, cy, 4.9 * COIN_S, 0, Math.PI * 2); c.stroke();
  // 五角星
  c.fillStyle = '#c9962a';
  c.beginPath();
  for (let i = 0; i < 10; i++) {
    const rr = (i % 2 ? 1.4 : 3.1) * COIN_S;
    const a = -Math.PI / 2 + i * Math.PI / 5;
    if (i === 0) c.moveTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
    else c.lineTo(cx + Math.cos(a) * rr, cy + Math.sin(a) * rr);
  }
  c.closePath(); c.fill();
})();

const COIN_SIZE = coinSprite.width / COIN_S;   // 逻辑尺寸

// 心形路径：以原点为中心，s 缩放（宽 18s 高 15s 左右），只建路径，填充/描边由调用方定
function heartPath(s) {
  ctx.beginPath();
  ctx.moveTo(0, 4.5 * s);
  ctx.bezierCurveTo(-9 * s, -3 * s, -4.5 * s, -9.5 * s, 0, -4 * s);
  ctx.bezierCurveTo(4.5 * s, -9.5 * s, 9 * s, -3 * s, 0, 4.5 * s);
  ctx.closePath();
}

// HUD 血量心：实心渐变=剩余，空心=已损失
function drawHeart(x, y, filled) {
  ctx.save();
  ctx.translate(x, y);
  heartPath(1);
  if (filled) {
    const g = ctx.createLinearGradient(0, -9, 0, 5);
    g.addColorStop(0, '#ff8fa3');
    g.addColorStop(1, '#e0436b');
    ctx.fillStyle = g;
    ctx.fill();
  } else {
    ctx.fillStyle = meters > 900 ? 'rgba(255,255,255,.16)' : 'rgba(30,40,70,.14)';
    ctx.fill();
    ctx.strokeStyle = meters > 900 ? 'rgba(255,255,255,.4)' : 'rgba(30,40,70,.35)';
    ctx.lineWidth = 1;
    ctx.stroke();
  }
  ctx.restore();
}

// 单枚金币：贴预渲染的 sprite，spin 控制旋转压扁
function drawCoin(x, y, spin) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(Math.max(0.18, spin), 1);
  ctx.drawImage(coinSprite, -COIN_SIZE / 2, -COIN_SIZE / 2, COIN_SIZE, COIN_SIZE);
  ctx.restore();
}

const PU_TIME = 600;   // 限时道具生效时长（帧，60=1秒）
const PU_STYLE = {
  magnet: {c: ['#ffc9c9', '#e05757']},
  spring: {c: ['#d8f7b0', '#4fbd55']},
  shield: {c: ['#b3e3ff', '#3f9fd8']},
  heart:  {c: ['#ffd4e0', '#f0508c']},
};

// 道具图标：白色剪影画在彩球上，s 为缩放
function drawPowerupIcon(kind, x, y, s, tipColor) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.strokeStyle = ctx.fillStyle = '#fff';
  if (kind === 'magnet') {
    // 马蹄形磁铁
    ctx.lineWidth = 4.2;
    ctx.beginPath();
    ctx.moveTo(-4.2, -5.5);
    ctx.lineTo(-4.2, 0);
    ctx.arc(0, 0, 4.2, Math.PI, 0, true);
    ctx.lineTo(4.2, -5.5);
    ctx.stroke();
    // 两个磁极头：用球底色压出双色磁铁的错觉
    ctx.fillStyle = tipColor;
    ctx.fillRect(-6.3, -8.2, 4.2, 3);
    ctx.fillRect(2.1, -8.2, 4.2, 3);
  } else if (kind === 'spring') {
    // 螺旋弹簧：四层线圈
    ctx.lineWidth = 1.8;
    for (const yy of [-6, -2, 2, 6]) {
      ctx.beginPath();
      ctx.ellipse(0, yy, 5, 2.4, 0, 0, Math.PI * 2);
      ctx.stroke();
    }
  } else if (kind === 'shield') {
    // 盾牌
    ctx.beginPath();
    ctx.moveTo(0, -8);
    ctx.quadraticCurveTo(4.5, -7, 6.5, -5);
    ctx.quadraticCurveTo(6.5, 2.5, 0, 8);
    ctx.quadraticCurveTo(-6.5, 2.5, -6.5, -5);
    ctx.quadraticCurveTo(-4.5, -7, 0, -8);
    ctx.fill();
  } else {
    // 红心（回血）
    heartPath(1.15);
    ctx.fill();
  }
  ctx.restore();
}

// 限时道具：彩色渐变球 + 图标，轻轻上下浮动
function drawPowerups() {
  for (const p of powerups) {
    if (p.taken) continue;
    const y = p.y - camY;
    if (y < -24 || y > H + 24) continue;
    const bob = Math.sin(frame * 0.05 + p.ph) * 3;
    const st = PU_STYLE[p.kind];
    const g = ctx.createRadialGradient(p.x - 3, y + bob - 4, 2, p.x, y + bob, 12);
    g.addColorStop(0, st.c[0]);
    g.addColorStop(1, st.c[1]);
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(p.x, y + bob, 11, 0, Math.PI * 2);
    ctx.fill();
    drawPowerupIcon(p.kind, p.x, y + bob, 1, st.c[1]);
  }
}

function drawCoins() {
  for (const c of coins) {
    if (c.taken) continue;
    const y = c.y - camY;
    if (y < -20 || y > H + 20) continue;
    const spin = Math.abs(Math.cos(frame * 0.09 + c.ph));   // 旋转：宽度周期性压扁
    const bob = Math.sin(frame * 0.05 + c.ph) * 2.5;        // 轻轻上下浮动
    drawCoin(c.x, y + bob, spin);
  }
}

function draw() {
  // 插值绘制：draw 期间临时把 camY/ball 换成视觉值，画完恢复逻辑值（各 draw* 函数无感知）
  const logicCamY = camY, logicX = ball.x, logicY = ball.y;
  camY = vcamY; ball.x = viewX; ball.y = viewY;
  drawBackground();
  drawWind();
  drawPlatforms();
  drawHazards();
  drawCoins();
  drawPowerups();
  drawBall();
  drawK3();
  if (screen === 'tutorial') drawTutorial(); else drawHUD();
  camY = logicCamY; ball.x = logicX; ball.y = logicY;
}

// 固定步长主循环：逻辑恒按 60fps 步进（STEP 累加器），90/120Hz 高刷屏不再按比例加速；
// 绘制仍跟随 rAF。面板（首页/商店/结算等）盖住画布时跳过 draw——canvas 自带最后一帧，省电降温
const STEP = 1000 / 60;
let lastT, acc = 0;
// 渲染插值状态：prev* = 上一逻辑步的位置（每步开头在 update 里快照），view* = 当前应显示的位置
let prevCamY = 0, prevBallX = 0, prevBallY = 0, vcamY = 0, viewX = 0, viewY = 0;
function snapView() { prevCamY = vcamY = camY; prevBallX = viewX = ball.x; prevBallY = viewY = ball.y; }
function loop(t) {
  requestAnimationFrame(loop);
  if (lastT === undefined) lastT = t;
  const dt = Math.min(t - lastT, 100);   // 切后台回来最多追 100ms，防一次性补帧跳变
  lastT = t;
  acc += dt;
  // 舍入式取步：iOS 的 rAF 时间戳只有 1ms 精度，60Hz 下 dt 按 17/16/17 循环，while(acc>=STEP)
  // 的阈值恰好卡在步长上 → 形成 1/2/0 步极限环（实测柱图 120120…），平滑估计也救不了
  // （EMA 输出仍围绕步长摆动）。改为舍入：判定带宽 ±10ms，量化抖动（±0.33ms）永远跨不过；
  // 残差留在 acc 里长期速率依旧精确；120Hz 自动成 0/1 均匀交替，真掉帧自动 1/2 补步
  const steps = Math.floor(acc / STEP + 0.4);
  acc -= steps * STEP;
  for (let i = 0; i < steps; i++) update();
  // 渲染插值：屏幕帧间隔（iOS 上 16/17ms 抖动）和逻辑步长 16.667ms 对不齐，不插值的话
  // 有的帧一次前进 2 步、有的帧原地不动 → 肉眼顿挫。alpha = 距下一逻辑步的时间比例，
  // 画面位置在 上一步 → 当前步 之间平滑过渡，帧率抖动被抹平
  const alpha = Math.max(0, Math.min(1, acc / STEP));   // 舍入取步后 acc 可能为小负值，钳回 [0,1]
  const snapX = Math.abs(ball.x - prevBallX) > W / 2;   // 穿屏环绕瞬移，不插值
  const snapY = Math.abs(ball.y - prevBallY) > 100;     // 护盾救命/复活/教学弹回瞬移，不插值
  vcamY = prevCamY + (camY - prevCamY) * alpha;
  viewX = snapX ? ball.x : prevBallX + (ball.x - prevBallX) * alpha;
  viewY = snapY ? ball.y : prevBallY + (ball.y - prevBallY) * alpha;
  if ((screen === 'game' && !dead) || screen === 'tutorial') draw();
  if (DEBUG) drawDebug(t, dt, steps);
}

// 帧率诊断条：URL 加 ?debug=1 开启（调查卡顿用）。底部黑条：文字 = 屏幕 fps · 本帧逻辑
// 步数 · 帧间隔 ms；小柱 = 最近 90 帧每帧步数（灰=0 绿=1 黄=2 红=3+），柱子颜色不均 = 节奏顿挫
const DEBUG = /[?&]debug/.test(location.search);
let dbgSecT = 0, dbgFrames = 0, dbgFps = 0;
const dbgSteps = [];
function drawDebug(t, dt, steps) {
  dbgSteps.push(steps);
  if (dbgSteps.length > 90) dbgSteps.shift();
  dbgFrames++;
  if (t - dbgSecT >= 1000) { dbgFps = dbgFrames; dbgFrames = 0; dbgSecT = t; }
  ctx.save();
  ctx.fillStyle = 'rgba(0,0,0,.55)';
  ctx.fillRect(0, H - 44, W, 44);
  ctx.fillStyle = '#9fe8a9';
  ctx.font = '11px monospace';
  ctx.textAlign = 'left';
  ctx.fillText(`v0904c · 屏幕 ${dbgFps}fps · 步数 ${steps} · 间隔 ${dt.toFixed(1)}ms`, 6, H - 28);
  const BAR_C = ['#7a7f9c', '#4fbd55', '#ffd54a', '#e05757'];
  for (let i = 0; i < dbgSteps.length; i++) {
    const s = dbgSteps[i];
    ctx.fillStyle = BAR_C[Math.min(s, 3)];
    ctx.fillRect(6 + i * 4.5, H - 6 - s * 5, 3.5, 2 + s * 5);
  }
  ctx.restore();
}

// ---------- 输入 ----------

document.addEventListener('keydown', e => {
  ensureAudio();
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') keys.left = true;
  else if (k === 'arrowright' || k === 'd') keys.right = true;
  else if (k === 'm') toggleMute();
  else if (k === ' ') {
    e.preventDefault();
    if (screen === 'tutorial' && tutStep === 2) finishTutorial();
    else if (screen === 'home' || (screen === 'game' && dead)) startPressed();
  }
});
document.addEventListener('keyup', e => {
  const k = e.key.toLowerCase();
  if (k === 'arrowleft' || k === 'a') keys.left = false;
  else if (k === 'arrowright' || k === 'd') keys.right = false;
});

function touchPos(e) {
  const rect = canvas.getBoundingClientRect();
  const t = e.touches[e.touches.length - 1];   // 认最新按下的手指：双拇指交替时方向不抽风
  return (t.clientX - rect.left) / rect.width * W;
}

// 游戏/教学进行中才接管触控（面板和按钮上的触摸不拦，走正常点击）
function touchActive() {
  return (screen === 'game' && !dead) || screen === 'tutorial';
}

// 触控挂在 document：游戏时全屏（含 canvas 上下留白）都能控制方向
document.addEventListener('touchstart', e => {
  if (e.target.closest('button, a')) return;
  ensureAudio();
  if (screen === 'tutorial' && tutStep === 2) { e.preventDefault(); finishTutorial(); return; }
  if (!touchActive()) return;
  e.preventDefault();
  touchDir = touchPos(e) < W / 2 ? -1 : 1;
}, {passive: false});
canvas.addEventListener('click', () => {   // 桌面端图鉴页点鼠标也出发
  if (screen === 'tutorial' && tutStep === 2) finishTutorial();
});
document.addEventListener('touchmove', e => {
  if (!touchActive()) return;
  e.preventDefault();
  touchDir = touchPos(e) < W / 2 ? -1 : 1;
}, {passive: false});
document.addEventListener('touchend', e => {
  if (e.touches.length === 0) touchDir = 0;
  else if (touchActive()) touchDir = touchPos(e) < W / 2 ? -1 : 1;   // 松开一根手指，跟随剩下的
}, {passive: false});
document.getElementById('mutebtn').textContent = muted ? '🔇' : '🔊';
document.getElementById('mutebtn').addEventListener('click', () => { ensureAudio(); toggleMute(); });
// 手机上看键盘提示没意义，换成触控说明
if ('ontouchstart' in window) document.getElementById('hint').textContent = '按住屏幕左/右半边移动，全屏任意位置都有效';

// ---------- 界面流程 ----------
const panels = {
  home: document.getElementById('home'),
  shop: document.getElementById('shop'),
  death: document.getElementById('death'),
  ach: document.getElementById('ach'),
  share: document.getElementById('share'),
};

function showPanel(name) {
  for (const k in panels) panels[k].hidden = (k !== name);
  if (name === 'home') {
    document.getElementById('homeBank').textContent = bank;
    document.getElementById('homeBest').textContent = bestMeters;
  }
}

function startGame() {
  ensureAudio();
  bounceV = equip.spring ? -12.2 : -11.2;
  showPanel(null);
  screen = 'game';
  reset();
}

function skillToast(t) { skillText = t; skillT = 100; }   // 技能触发横幅（HUD y275）

function die(reason, byThunder) {
  // 死与税：红球专属——清空本局金币换复活（每局一次；护盾优先，能走到这说明盾用完了）
  if (curSkin === 'duanpo' && !taxUsed && coinCount > 0) {
    taxUsed = true;
    skillToast(`死与税：-${coinCount} 金币，复活`);
    coinCount = 0;
    ball.y = camY + H * 0.55;
    ball.vy = bounceV;
    ball.vx = 0;
    invincibleT = 90;   // 复活短暂无敌，防落地连死
    sfx.power();
    return;
  }
  dead = true;
  sfx.fall();
  bank += coinCount;
  const m = Math.floor(meters);
  if (m > bestMeters) bestMeters = m;
  saveLS('jtm_best', bestMeters);
  saveMeta();
  checkAch(!!byThunder);
  document.getElementById('deathTitle').textContent = reason || '坠落啦';
  document.getElementById('deathStats').textContent =
    `本次 ${m} m · 金币 +${coinCount} · 存款 ${bank}`;
  showPanel('death');
}

// ---------- 商店 ----------
function renderShop() {
  document.getElementById('shopBank').textContent = bank;
  const list = document.getElementById('shopList');
  list.innerHTML = '';

  const cat1 = document.createElement('div');
  cat1.className = 'shop-cat';
  cat1.textContent = '小球角色';
  list.appendChild(cat1);
  for (const s of SKINS) {
    const owned = ownedSkins.includes(s.id);
    const row = document.createElement('div');
    row.className = 'shop-row';
    row.innerHTML = `<span class="mini-ball" style="background:radial-gradient(circle at 35% 30%, ${s.c[0]}, ${s.c[1]} 60%, ${s.c[2]})"></span><span class="shop-name">${s.name} · ${s.skill}<small>${s.sd}</small></span>`;
    const b = document.createElement('button');
    b.className = 'shop-btn';
    if (curSkin === s.id) {
      b.textContent = '使用中'; b.disabled = true;
    } else if (owned) {
      b.textContent = '使用';
      b.onclick = () => { curSkin = s.id; saveMeta(); renderShop(); };
    } else {
      b.textContent = `${s.price} 金币`;
      b.disabled = bank < s.price;
      b.onclick = () => {
        if (bank < s.price) return;
        bank -= s.price;
        ownedSkins.push(s.id);
        curSkin = s.id;
        saveMeta(); unlock('shopper'); renderShop(); sfx.coin();
      };
    }
    row.appendChild(b);
    list.appendChild(row);
  }

  const cat2 = document.createElement('div');
  cat2.className = 'shop-cat';
  cat2.textContent = '道具（永久拥有，可装备/卸下）';
  list.appendChild(cat2);
  for (const it of ITEMS) {
    const owned = !!ownedItems[it.id];
    const row = document.createElement('div');
    row.className = 'shop-row';
    row.innerHTML = `<span class="shop-name">${it.name}<small>${it.desc}</small></span>`;
    const b = document.createElement('button');
    b.className = 'shop-btn';
    if (owned && equip[it.id]) {
      b.textContent = '卸下';
      b.onclick = () => { equip[it.id] = false; saveMeta(); renderShop(); };
    } else if (owned) {
      b.textContent = '装备';
      b.onclick = () => { equip[it.id] = true; saveMeta(); renderShop(); };
    } else {
      b.textContent = `${it.price} 金币`;
      b.disabled = bank < it.price;
      b.onclick = () => {
        if (bank < it.price) return;
        bank -= it.price;
        ownedItems[it.id] = true;
        equip[it.id] = true;
        saveMeta(); unlock('shopper'); renderShop(); sfx.coin();
      };
    }
    row.appendChild(b);
    list.appendChild(row);
  }
}

document.getElementById('btnStart').onclick = startPressed;
document.getElementById('btnShop').onclick = () => { ensureAudio(); screen = 'shop'; renderShop(); showPanel('shop'); };
document.getElementById('btnBack').onclick = () => { screen = 'home'; showPanel('home'); };
document.getElementById('btnRetry').onclick = startGame;
document.getElementById('btnDeathShop').onclick = () => { screen = 'shop'; renderShop(); showPanel('shop'); };
document.getElementById('btnHome').onclick = () => { screen = 'home'; reset(); showPanel('home'); };
document.getElementById('btnAch').onclick = () => { ensureAudio(); renderAch(); showPanel('ach'); };
document.getElementById('btnAchBack').onclick = () => showPanel('home');
document.getElementById('btnTut').onclick = () => { startTutorial(); };
document.getElementById('skipTut').onclick = () => { finishTutorial(); };
document.getElementById('btnShare').onclick = () => {
  const url = makeShareCard(Math.floor(meters), coinCount, won).toDataURL('image/png');
  document.getElementById('shareImg').src = url;
  document.getElementById('btnDl').href = url;
  showPanel('share');
};
document.getElementById('btnShareBack').onclick = () => showPanel('death');

reset();
showPanel('home');
requestAnimationFrame(loop);
</script>

// PWA：注册离线缓存（仅 HTTPS 下生效，门牌 http 渠道自动跳过）
if ('serviceWorker' in navigator && location.protocol === 'https:') {
  navigator.serviceWorker.register('sw.js');
}
</script>
